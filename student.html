<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقديم - مكتب الوسام</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ccc;
    }

    h1 {
      text-align: center;
      color: #1d4f91;
    }

    h2 {
      color: #333;
      margin-top: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: #1d4f91;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    .back {
      background: #777;
    }

    .note {
      background: #eef4fb;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      line-height: 1.8;
    }
  </style>
</head>
