<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقديم - مكتب الوسام</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ccc;
    }

    h1 {
      text-align: center;
      color: #1d4f91;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: #1d4f91;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
    }

    .back {
      background: #777;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎓 مكتب الوسام</h1>

  <h2>استمارة التقديم</h2>

  <label>نوع التقديم</label>
  <select id="category">
    <option value="">اختر نوع التقديم</option>
    <option value="المنح الجامعية">المنح الجامعية</option>
    <option value="الجامعات الحكومية">الجامعات الحكومية</option>
    <option value="الجامعات الخاصة">الجامعات الخاصة</option>
  </select>

  <label>الدولة</label>
  <select id="country">
    <option value="">اختر الدولة</option>
    <option value="السعودية">السعودية</option>
    <option value="مصر">مصر</option>
    <option value="الصين">الصين</option>
    <option value="تركيا">تركيا</option>
  </select>

  <label>التخصص</label>
  <select id="major">
    <option value="">اختر التخصص</option>
    <option value="جميع التخصصات">جميع التخصصات</option>
  </select>

  <label>الاسم الكامل</label>
  <input type="text" id="name" required>

  <label>رقم الهاتف</label>
  <input type="tel" id="phone" required>

  <label>الجنسية</label>
  <input type="text" id="nationality" required>

  <button onclick="nextStep()">التالي ←</button>

  <button class="back" onclick="location.href='index.html'">
    الصفحة الرئيسية
  </button>

</div>

<script>
function nextStep() {

  const category = document.getElementById("category").value;
  const country = document.getElementById("country").value;
  const major = document.getElementById("major").value;
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const nationality = document.getElementById("nationality").value.trim();

  if (!category || !country || !major || !name || !phone || !nationality) {
    alert("❌ يرجى إكمال جميع البيانات");
    return;
  }

  localStorage.setItem("applicationData", JSON.stringify({
    category: category,
    country: country,
    major: major,
    name: name,
    phone: phone,
    nationality: nationality
  }));

  window.location.href = "documents.html";
}
</script>

</body>
</html>
