<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتب الوسام - التقديم</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ccc;
    }

    h1 {
      text-align: center;
      color: #1d4f91;
    }

    h2 {
      margin-top: 30px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: #1d4f91;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    .logout {
      background: #777;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎓 مكتب الوسام</h1>

  <h2>استمارة التقديم</h2>

  <label>نوع التقديم</label>
  <select id="category">
    <option value="">اختر نوع التقديم</option>
    <option>المنح الجامعية</option>
    <option>الجامعات الحكومية</option>
    <option>الجامعات الخاصة</option>
  </select>

  <label>الدولة</label>
  <select id="country">
    <option value="">اختر الدولة</option>
    <option>السعودية</option>
    <option>مصر</option>
    <option>الصين</option>
    <option>تركيا</option>
  </select>

  <label>التخصص</label>
  <select id="major">
    <option value="">اختر التخصص</option>
    <option>جميع التخصصات</option>
  </select>

  <label>الاسم الكامل</label>
  <input type="text" id="name" placeholder="اكتب الاسم الكامل">

  <label>رقم الهاتف</label>
  <input type="tel" id="phone" placeholder="اكتب رقم الهاتف">

  <label>الجنسية</label>
  <input type="text" id="nationality" placeholder="اكتب الجنسية">

  <button onclick="nextStep()">التالي ←</button>

  <button class="logout" onclick="logout()">تسجيل الخروج</button>

</div>

<script>
function nextStep() {
  const category = document.getElementById("category").value;
  const country = document.getElementById("country").value;
  const major = document.getElementById("major").value;
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const nationality = document.getElementById("nationality").value;

  if (!category || !country || !major || !name || !phone || !nationality) {
    alert("يرجى إكمال جميع البيانات");
    return;
  }

  localStorage.setItem("applicationData", JSON.stringify({
    category,
    country,
    major,
    name,
    phone,
    nationality
  }));

  window.location.href = "documents.html";
}

function logout() {
  window.location.href = "login.html";
}
</script>

</body>
</html>
