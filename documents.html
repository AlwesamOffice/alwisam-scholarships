<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رفع المستندات - مكتب الوسام</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ccc;
    }

    h1 {
      text-align: center;
      color: #1d4f91;
    }

    p {
      color: #555;
      line-height: 1.8;
    }

    .document {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input[type="file"] {
      width: 100%;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: #1d4f91;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    .back {
      background: #777;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>📄 المستندات المطلوبة</h1>

  <p>
    يرجى رفع المستندات المطلوبة للتقديم.
    <br>
    الملفات المطلوبة بعلامة (*) إلزامية.
  </p>

  <div class="document">
    <label>📘 الجواز *</label>
    <input type="file" id="passport" accept=".pdf,.jpg,.jpeg,.png">
  </div>

  <div class="document">
    <label>🎓 شهادة الثانوية *</label>
    <input type="file" id="certificate" accept=".pdf,.jpg,.jpeg,.png">
  </div>

  <div class="document">
    <label>📜 شهادة الميلاد</label>
    <input type="file" id="birth" accept=".pdf,.jpg,.jpeg,.png">
  </div>
