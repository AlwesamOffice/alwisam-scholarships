<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - مكتب الوسام</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
    }

    .box {
      max-width: 420px;
      margin: 70px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #123b5d;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #666;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #123b5d;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #0d2d46;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #123b5d;
      text-decoration: none;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🎓 مكتب الوسام</h1>
    <p>تسجيل الدخول إلى حسابك</p>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        required
      >

      <button type="submit">تسجيل الدخول</button>

    </form>

    <div id="message"></div>

    <a href="register.html">إنشاء حساب جديد</a>
    <a href="index.html">العودة إلى الصفحة الرئيسية</a>
  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = "https://bjiasnxdqxbxobqaovgh.supabase.co/rest/v1/";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_E5cMO9MoOnCt7QwUJrRcZw_WwaLK8b6";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    document.getElementById("loginForm").addEventListener("submit", async function(e) {

      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "جاري تسجيل الدخول...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

    if (error) {

  message.textContent = "❌ " + error.message;

  return;
}
      

      message.textContent = "✅ تم تسجيل الدخول بنجاح";

      setTimeout(function() {
        window.location.href = "student.html";
      }, 1000);

    });

  </script>

</body>
</html>
