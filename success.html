<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم إرسال الطلب - مكتب الوسام</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 550px;
      margin: 70px auto;
      background: white;
      padding: 35px 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ccc;
      text-align: center;
    }

    .check {
      font-size: 65px;
    }

    h1 {
      color: #1d4f91;
    }

    .number {
      background: #f0f3f7;
      padding: 15px;
      border-radius: 10px;
      margin: 25px 0;
      font-size: 20px;
      font-weight: bold;
      color: #1d4f91;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: #1d4f91;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    .home {
      background: #777;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="check">✅</div>

  <h1>تم إرسال الطلب بنجاح</h1>

  <p>
    شكرًا لتقديمك عبر مكتب الوسام للتقديم والمنح الجامعية.
  </p>

  <p>رقم طلبك هو:</p>

  <div class="number" id="applicationNumber">
    جاري تحميل رقم الطلب...
  </div>

  <p>
    احتفظ برقم الطلب لمتابعة حالة تقديمك.
  </p>

  <button onclick="trackApplication()">
    متابعة الطلب
  </button>

  <button class="home" onclick="location.href='index.html'">
    العودة إلى الصفحة الرئيسية
  </button>

</div>

<script>
  const number =
    localStorage.getItem("applicationNumber");

  document.getElementById("applicationNumber").textContent =
    number || "لم يتم العثور على رقم الطلب";

  function trackApplication() {
    alert(
      "رقم طلبك: " +
      (number || "غير متوفر") +
      "\n\nحالة الطلب: قيد المراجعة"
    );
  }
</script>

</body>
</html>
